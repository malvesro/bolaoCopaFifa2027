# Modelo de referência para Docker Compose no Ubuntu/WSL2.
# O script setup-omniroute.sh gera a configuração operacional automaticamente
# e preserva variáveis adicionais quando migra um container existente.
services:
  # Executa como root apenas para preparar as permissões do volume.
  # O serviço OmniRoute só inicia quando esta etapa termina com sucesso.
  permissions-init:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:latest}
    pull_policy: never
    user: "0:0"
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      set -eu
      echo "[1/3] Corrigindo proprietário de /data para UID:GID 1000:1000..."
      chown -R 1000:1000 /data
      echo "[OK] Proprietário corrigido."
      echo "[2/3] Definindo permissões 750 em /data..."
      chmod 750 /data
      echo "[OK] Permissões aplicadas."
      echo "[3/3] Conferindo o resultado..."
      stat -c 'Permissoes=%A | UID:GID=%u:%g | Diretorio=%n' /data
      test -w /data
      echo "[OK] Preparação do volume concluída."
    volumes:
      - omniroute-data:/data
    restart: "no"

  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:latest}
    pull_policy: never
    container_name: omniroute
    user: "node"
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      DATA_DIR: /data
    # Acesso local somente. Não publicar em 0.0.0.0 sem revisar a segurança.
    ports:
      - "127.0.0.1:20128:20128"
    # O banco e configurações ficam fora da camada descartável do container.
    volumes:
      - omniroute-data:/data
    # Não iniciar a aplicação se a preparação de permissões falhar.
    depends_on:
      permissions-init:
        condition: service_completed_successfully

volumes:
  omniroute-data:
    # Nome explícito evita que Compose crie um volume com prefixo do projeto.
    name: ${OMNIROUTE_VOLUME:-omniroute-data}
